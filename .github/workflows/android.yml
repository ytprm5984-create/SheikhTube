name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle assembleDebug
      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SheikhTube-V2.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SHEIKHTUBE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > sheikhtube-release.jks
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STORE_PASS: ${{ secrets.SHEIKHTUBE_STORE_PASS }}
          KEY_PASS: ${{ secrets.SHEIKHTUBE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.SHEIKHTUBE_KEY_ALIAS }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/sheikhtube-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk "SheikhTube-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "SheikhTube-${GITHUB_REF_NAME}.apk" --title "Sheikh Tube $GITHUB_REF_NAME" --generate-notes
